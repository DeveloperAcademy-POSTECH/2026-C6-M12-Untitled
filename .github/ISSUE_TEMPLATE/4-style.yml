name: "Style: UI 작업"
description: 화면 · 디자인을 작업할 때 사용합니다.
title: "[Style] "
labels: ["🎨 style"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 어떤 화면인가요?
      placeholder: 예) PlayerView 트랙 줄 · 믹서 UI 구현
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      value: "- [ ] "
    validations:
      required: true
  - type: input
    id: figma
    attributes:
      label: 피그마 링크 (선택)
      placeholder: https://www.figma.com/...
