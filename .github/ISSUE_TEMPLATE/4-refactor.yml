name: "Refactor: 코드 리팩토링"
description: 동작은 그대로 두고 코드 구조를 바꿀 때 사용합니다.
title: "[Refactor] "
labels: ["Refactor"]
body:
  - type: textarea
    id: reason
    attributes:
      label: 왜 바꾸나요?
      placeholder: 예) SessionFeature.swift가 길어져서 SessionPhase를 파일로 분리
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 바꾸는 범위
      placeholder: 예) Features/SessionFeature
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      value: "- [ ] "
