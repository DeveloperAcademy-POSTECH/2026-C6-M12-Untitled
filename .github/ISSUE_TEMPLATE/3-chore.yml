name: "Chore: 세팅 · 문서 · 자잘한 수정"
description: 프로젝트 세팅, 문서 작성, 오타 · 이름 변경 등 작은 작업에 사용합니다.
title: "[Chore] "
labels: ["Chore"]
body:
