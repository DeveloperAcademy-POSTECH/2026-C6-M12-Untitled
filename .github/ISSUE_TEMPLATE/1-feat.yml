name: "Feat: 기능 구현"
description: 새 기능 · 화면(UI) · 파일/에셋 추가 등을 작업할 때 사용합니다.
title: "[Feat] "
labels: ["Feat"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 어떤 기능인가요?
      placeholder: 예) SessionFeature 곡 올리기 흐름 구현 / PlayerView 믹서 UI 구현
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      value: "- [ ] "
      placeholder: |
        - [ ] SeparationClient 연결
        - [ ] 업로드 · 분리 · 다운로드 Action 처리
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 참고 자료 (선택)
      placeholder: 피그마 링크 · 다이어그램 · 추가할 에셋 등
