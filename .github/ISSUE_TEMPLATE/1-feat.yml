name: "Feat: 기능 구현"
description: 새 기능을 구현할 때 사용합니다.
title: "[Feat] "
labels: ["Feat"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 어떤 기능인가요?
      placeholder: 예) SessionFeature 곡 올리기 흐름 구현
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 항목
      value: "- [ ] "
      placeholder: |
        - [ ] SeparationClient 연결
        - [ ] 업로드 · 분리 · 다운로드 Action 처리
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 참고 자료 (선택)
      placeholder: 피그마 클래스 다이어그램 · 시퀀스 다이어그램 링크 등
