name: "Fix: 버그 수정"
description: 버그를 고칠 때 사용합니다.
title: "[Fix] "
labels: ["🤬 fix"]
body:
  - type: textarea
    id: bug
    attributes:
      label: 어떤 버그인가요?
      description: 어떤 버그인지 간결하게 설명해주세요.
      placeholder: 예) 곡을 다시 열면 재생 위치가 처음으로 돌아가지 않음
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: 어떤 상황에서 발생한 버그인가요?
      description: (가능하면) Given-When-Then 형식으로 서술해주세요.
      value: |
        - **Given**: 
        - **When**: 
        - **Then**: 
      placeholder: |
        - Given: 곡 A를 재생하다가 곡 B로 전환한 상태에서
        - When: 다시 곡 A를 열면
        - Then: 재생 위치가 처음이 아니라 이전 위치에 남아 있다
  - type: textarea
    id: expected
    attributes:
      label: 예상 결과
      description: 예상했던 정상적인 결과가 어떤 것이었는지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 참고 자료 (선택)
      description: 스크린샷 · 로그 · 테스트 환경(기기, OS 버전) 등
